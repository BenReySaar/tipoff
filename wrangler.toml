# טיפ-אוף — Cloudflare Worker configuration.
# Fill in the three values marked FILL (the guide explains where each one comes from).

name = "tipoff"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The app (public/) is served as static files; /api, /cal and /stats go to the worker.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "tipoff"
database_id = "FILL-d1-database-id"

[[kv_namespaces]]
binding = "KV"
id = "FILL-kv-namespace-id"

[triggers]
# :07 every hour: sync from the association. 17:00+18:00 UTC: one of them is 20:00 in Israel (winter/summer) for the evening reminder.
crons = ["7 * * * *", "0 17,18 * * *"]

[vars]
SEASON = "2026"                       # 2026 = season 2026/27. Change once a year.
APP_URL = "https://FILL-your-domain"  # the app's address, used in shared links
VAPID_PUBLIC = "FILL-from-npm-run-vapid"
VAPID_SUBJECT = "mailto:FILL-your-email"
# Secrets (not in this file): VAPID_PRIVATE_JWK, ADMIN_KEY — set with `npx wrangler secret put <NAME>`
