# טיפ-אוף — Cloudflare Worker configuration.
# Two values marked FILL: the database id and the KV id, from the Cloudflare dashboard.

name = "tipoff"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The app (public/) is served as static files; /api, /cal and /stats go to the worker.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "tipoff"
database_id = "FILL-d1-database-id"

[[kv_namespaces]]
binding = "KV"
id = "FILL-kv-namespace-id"

[triggers]
# :07 every hour: sync from the association. 17:00+18:00 UTC: one of them is 20:00 in Israel (winter/summer) for the evening reminder.
crons = ["7 * * * *", "0 17,18 * * *"]

[vars]
SEASON = "2026"   # 2026 = season 2026/27. Change once a year.
# One secret is set in the Cloudflare dashboard (not in this file): ADMIN_KEY, the password for /stats.
# Push keys are created by the server on first run and kept in KV.
